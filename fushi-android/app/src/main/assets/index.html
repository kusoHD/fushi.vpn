}
function arc(t){
 var a=W(ME.lon,ME.lat),b=W(t.lon,t.lat),mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
 var d=Math.hypot(a[0]-b[0],a[1]-b[1]);
 $('arc').setAttribute('d','M'+a[0]+','+a[1]+' Q'+mx+','+(my-Math.min(40,d*.3))+' '+b[0]+','+b[1]);
}
function fly(t,s){
 var d=Math.hypot(t.lon-cam.lon,t.lat-cam.lat);
 if(d>20){
  setCam((t.lon+cam.lon)/2,(t.lat+cam.lat)/2,Math.max(2.2,Math.min(6,260/(d*1.3))));
  later(function(){setCam(t.lon,t.lat,s)},800);
  return 1900;
 }
 setCam(t.lon,t.lat,s);return 1100;
}
function later(f,ms){timers.push(setTimeout(f,ms))}
(function(){var m=$('map');m.classList.add('nt');setCam(ME.lon,ME.lat,3.6);void m.offsetWidth;m.classList.remove('nt')})();

/* ---------- YORDAMCHI ---------- */
function put(el,t){if(el.textContent!==t){el.textContent=t;el.classList.remove('sw');void el.offsetWidth;el.classList.add('sw')}}
function badge(c,s){return '<div class="badge'+(s?' s':'')+'">'+c+'</div>'}
function best(){return C.slice().sort(function(a,b){return a[2]-b[2]})[0]}
function ip(c){return {DE:'94.130.18.42',NL:'185.107.56.9',TR:'176.53.216.3',US:'104.28.17.5',JP:'103.231.88.4',FR:'51.15.110.7',PL:'185.246.33.8',FI:'95.216.14.2',CH:'185.156.175.6'}[c]}

/* ---------- ASOSIY HOLAT ---------- */
function render(){
 var on=st.on,bz=st.busy,t=$('t-home');
 t.classList.toggle('on-c',on);
 var sh=$('sh'),cls=on?'s-on':(bz?'s-busy':'s-idle');
 if(!sh.firstChild)sh.innerHTML='<svg class="shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path class="fl" d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path class="o" d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><g class="chk"><path d="M8.5 12l2.5 2.5L16 9.5"/></g><g class="crs"><path d="M9.5 9.5l5 5M14.5 9.5l-5 5"/></g></svg>';
 sh.firstChild.setAttribute('class','shield '+cls);
 put($('stt'),on&&!bz?'Himoyalangan':(bz?'Ulanmoqda':'Himoyalanmagan'));
 var tg=st.target;
 put($('loc'),on&&!bz?tg[0]+' · '+ip(tg[1]):(bz&&tg?tg[0]+' · ...':(st.real||'Aniqlanmoqda...')));
 $('bolt').innerHTML=S(IC.bolt);
 var s=st.sel;
 put($('sn'),s?s[0]:'Eng tez bepul server');
 if(s)put($('ss'),'Ping '+s[2]+' ms');
 else if(!$('ss').querySelector('.cl'))$('ss').innerHTML='Avtomatik tanlanadi: <span class="cl">'+badge('US',1)+badge('NL',1)+badge('JP',1)+'</span> +7';
 var b=$('btn');
 b.classList.toggle('busy',bz);
 b.classList.toggle('out',on&&!bz);
 put(b,bz?(on?'Uzilmoqda':'Ulanmoqda'):(on?'Uzish':'Ulanish'));
 $('t-countries').querySelectorAll('.item').forEach(function(e){e.classList.toggle('sel',!!(on&&tg&&e.dataset.c===tg[1]))});
}
function tick(){var x=Math.floor((Date.now()-st.t0)/1000),f=function(n){return(n<10?'0':'')+n};$('tm').textContent=f(Math.floor(x/3600))+':'+f(Math.floor(x/60)%60)+':'+f(x%60)}
function splash(c){
 var el=document.createElement('div');
 el.style.cssText='position:fixed;left:50%;top:38%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;pointer-events:none;z-index:9;background:radial-gradient(circle,'+c+' 0%,transparent 70%)';
 document.body.appendChild(el);
 var k=Math.max(innerWidth,innerHeight)*2.6/24;
 var a=el.animate([{transform:'scale(.4)',opacity:1},{transform:'scale('+k+')',opacity:0}],{duration:1100,easing:'cubic-bezier(.2,.8,.2,1)'});
 a.onfinish=function(){el.remove()};
 var w=document.querySelector('.wrap');
 if(w&&w.animate)w.animate([{transform:'scale(1)'},{transform:'scale(.965)'},{transform:'scale(1)'}],{duration:620,easing:'cubic-bezier(.2,.8,.2,1)'});
}
function connect(c){
 if(st.busy)return;
 if(st.on&&st.target&&st.target[1]===c[1]){showTab('home');return}
 timers.forEach(clearTimeout);timers=[];
 st.target=c;if(window.Android)Android.connect('');svPos={lon:c[4],lat:c[5]};arc(svPos);
 setCam(c[4],c[5],4.2);
 st.on=true;st.busy=false;st.t0=Date.now();tick();clearInterval(iv);iv=setInterval(tick,1000);
 render();
}
function disconnect(){
 if(st.busy)return;
 if(window.Android)Android.disconnect();
 timers.forEach(clearTimeout);timers=[];
 st.on=false;st.target=null;clearInterval(iv);$('tm').textContent='';
 svPos={lon:ME.lon,lat:ME.lat};setCam(ME.lon,ME.lat,3.6);
 render();
}
$('btn').onclick=function(){
 if(st.busy)return;
 if(st.on)disconnect();else connect(st.sel||best());
};

/* ---------- OYNALAR ---------- */
function showTab(t){
 st.tab=t;
 ['home','countries','profiles','settings'].forEach(function(x){$('t-'+x).classList.toggle('on',x===t)});
 navr();window.scrollTo(0,0);
}
function navr(){
 var n=[['home','Bosh sahifa'],['globe','Davlatlar'],['prof','Profillar'],['set','Sozlamalar']],k=['home','countries','profiles','settings'];
 $('nav').innerHTML=n.map(function(a,i){return '<button class="'+(st.tab===k[i]?'on':'')+'" data-go="'+k[i]+'"><span class="p">'+S(IC[a[0]])+'</span>'+a[1]+'</button>'}).join('')}
function clist(){
 var q=$('q').value.toLowerCase().trim();
 $('chips').innerHTML=[['all','Hammasi'],['c','Secure Core'],['p','P2P'],['t','Tor']].map(function(a){return '<button class="chip'+(st.f===a[0]?' on':'')+'" data-f="'+a[0]+'">'+a[1]+'</button>'}).join('');
 var l=C.filter(function(c){return(st.f==='all'||c[3].indexOf(st.f)>-1)&&c[0].toLowerCase().indexOf(q)>-1});
 $('clist').innerHTML=l.map(function(c,i){
  var on=st.on&&st.target&&st.target[1]===c[1];
  return '<div class="item'+(on?' sel':'')+'" style="--i:'+i+'" data-c="'+c[1]+'">'+badge(c[1])+'<div class="g"><div class="t1">'+c[0]+'</div></div><span class="ping">'+c[2]+' ms</span></div>'}).join('')||'<p class="t2">Hech narsa topilmadi</p>'}
$('q').oninput=clist;
function plist(){
 $('plist').innerHTML=P.map(function(p,i){return '<div class="item" style="--i:'+i+'" data-p="'+i+'"><div class="pi">'+S(IC[p[2]])+'</div><div class="g"><div class="t1">'+p[0]+'</div><div class="t2">'+p[1]+'</div></div></div>'}).join('')}
function tgl(k){return '<span class="tg'+(st[k]?' on':'')+'"></span>'}
function sett(){
 var th=[['auto','Avto'],['light','Yorugʻ'],['dark','Qorongʻi']],ic=[['Fushi','m0'],['Qora-oq','m1'],['Retro','m2']],i=0;
 var row=function(k,a,b){return '<div class="item" style="--i:'+(i++)+'" data-t="'+k+'"><div class="g"><div class="t1">'+a+'</div><div class="t2">'+b+'</div></div>'+tgl(k)+'</div>'};
 $('sett').innerHTML=
 '<div class="sec">Ulanish</div>'+
 '<div class="item" style="--i:0" data-proto="1"><div class="g"><div class="t1">Protokol</div><div class="t2" id="pv">'+PR[st.proto]+'</div></div></div>'+
 row('kill','Kill switch','VPN uzilsa, internet ham oʻchadi')+
 row('split','Split tunneling','Ayrim ilovalar VPN’siz')+
 row('shield','NetShield','Reklama va zararli saytlarni bloklash')+
 '<div class="sec">Umumiy</div><div class="t1">Mavzu</div>'+
 '<div class="seg">'+th.map(function(a){return '<button data-th="'+a[0]+'" class="'+(st.theme===a[0]?'on':'')+'">'+a[1]+'</button>'}).join('')+'</div>'+
 '<div class="t1" style="margin-top:20px">Ilova belgisi</div>'+
 '<div class="icons">'+ic.map(function(a,j){return '<div class="ic'+(st.icon===j?' on':'')+'" data-ic="'+j+'"><div class="mk '+a[1]+'">'+S(IC.fushi)+'</div>'+a[0]+'</div>'}).join('')+'</div>'+
 '<div class="note">Fushi VPN · versiya 1.0<br>Bu namunaviy interfeys, haqiqiy tunnel Android ilovada ishlaydi.</div>'}
function mark(sel,attr,val){document.querySelectorAll(sel).forEach(function(e){e.classList.toggle('on',e.dataset[attr]===String(val))})}
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-go],[data-f],[data-c],[data-p],[data-t],[data-th],[data-ic],[data-proto]');if(!el)return;
 var d=el.dataset;
 if(d.go){showTab(d.go)}
 else if(d.f){st.f=d.f;clist()}
 else if(d.c){if(st.busy)return;var c=C.filter(function(x){return x[1]===d.c})[0];st.sel=c;showTab('home');connect(c)}
 else if(d.p!==undefined){if(st.busy)return;var c2=C[P[+d.p][3]];st.sel=c2;showTab('home');connect(c2)}
 else if(d.t){st[d.t]=!st[d.t];el.querySelector('.tg').classList.toggle('on',st[d.t])}
 else if(d.th){st.theme=d.th;var r=document.documentElement;if(d.th==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',d.th);mark('[data-th]','th',d.th)}
 else if(d.ic){st.icon=+d.ic;mark('[data-ic]','ic',d.ic)}
 else if(d.proto){st.proto=(st.proto+1)%PR.length;put($('pv'),PR[st.proto])}
});
function loadReal(){fetch('https://ipapi.co/json/').then(function(r){return r.json()}).then(function(d){if(d&&d.ip){st.real=d.ip+' · '+(d.country_name||d.country||'');render()}}).catch(function(){if(!st.real){put($('loc'),'Internet aniqlanmadi')}})}
navr();render();clist();plist();sett();
loadReal();setInterval(loadReal,60000);
</script>
</body>
